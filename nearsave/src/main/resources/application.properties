# ================================================================
# NearSave — Application Configuration
# ================================================================

# ── SERVER ──────────────────────────────────────────────────────
server.port=8080

# ── DATABASE ─────────────────────────────────────────────────────
# MySQL connection — configurable via env vars for Docker deployment
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nearsave_db}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / HIBERNATE ──────────────────────────────────────────────
# validate  → checks schema matches entities (use in production)
# update    → auto-adds missing columns (use in development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# MySQL 8 dialect with spatial support
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JWT ──────────────────────────────────────────────────────────
# Secret key — MUST be changed in production (min 256 bits)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── BUSINESS RULES ───────────────────────────────────────────────
# How many metres around the user to search for products
app.search.radius-metres=1000
# Token expires this many minutes after booking
app.booking.token-expiry-minutes=30
# Products must have at least this many days until expiry to be listed
app.product.min-expiry-days=30

# ── STATIC RESOURCES ─────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.view.suffix=.html

# ── LOGGING ──────────────────────────────────────────────────────
logging.level.com.nearsave=DEBUG
logging.level.org.springframework.security=INFO
