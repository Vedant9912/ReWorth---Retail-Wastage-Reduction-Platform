version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: nearsave-db
    restart: always
    environment:
      MYSQL_DATABASE: nearsave_db
      MYSQL_ROOT_PASSWORD: Ayano#123
    ports:
      - "3306:3306"
    volumes:
      - ./nearsave/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pAyano#123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Service
  app:
    build: ./nearsave
    container_name: nearsave-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: nearsave_db
      DB_USERNAME: root
      DB_PASSWORD: Ayano#123
    depends_on:
      db:
        condition: service_healthy
